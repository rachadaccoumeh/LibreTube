name: Build and release app

# fork releases: push an annotated tag like v1.0.0 on the release branch;
# the tag message becomes the release notes
on:
  push:
    tags:
      - 'v*.*'

jobs:
  build:
    name: Build, sign and release app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon -PforkVersionName="${GITHUB_REF_NAME#v}" -PforkVersionCode="${{ github.run_number }}"

      - name: Sign APK
        uses: ilharp/sign-android-release@v2
        id: sign
        with:
          signingKey: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      # actions/checkout keeps only a lightweight copy of the tag, fetch it to read its message
      - name: Read release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

      - name: Rename apk file
        run: mv "${{ steps.sign.outputs.signedFile }}" "LibreTube-Fork-${GITHUB_REF_NAME}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: "LibreTube-Fork-*.apk"
          fail_on_unmatched_files: true
          make_latest: true
